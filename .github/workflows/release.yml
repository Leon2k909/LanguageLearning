# Builds the Windows desktop artifacts for every versioned main push and
# attaches them to that release.
#
# Windows is built here rather than on the dev machine because local antivirus
# real-time scanning holds the freshly extracted Electron binaries, making
# electron-builder's win-unpacked.tmp -> win-unpacked rename fail (EPERM/EBUSY).
# CI runners have no such interference.
#
# NOTE: .blockmap files are deliberately NOT uploaded. electron-updater uses
# them for differential downloads, which stall on this app's installer — the
# full download is reliable, so we ship exe + latest.yml only.
name: release-build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build or rebuild (e.g. v1.0.38)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  # Auto-update only needs the newest version. If an older Windows build is
  # stuck or still queued, let the latest version replace it instead of
  # blocking every subsequent release behind stale work.
  cancel-in-progress: true

# Read-only unless a job says otherwise. Only the two jobs that create and
# publish the release can write to it; the build in between cannot.
permissions:
  contents: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_build: ${{ steps.release.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure GitHub release exists
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          TAG="${REQUESTED_TAG:-v$(node -p "require('./package.json').version")}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            ASSET_COUNT="$(gh release view "$TAG" --json assets --jq '.assets | length' --repo "$GITHUB_REPOSITORY")"
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft' --repo "$GITHUB_REPOSITORY")"
            echo "Release $TAG already exists with $ASSET_COUNT assets (draft: $IS_DRAFT)"
            # A draft left over from a failed or cancelled run has to be built
            # again, otherwise it stays a draft for ever and never ships.
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$ASSET_COUNT" -lt 2 ] || [ "$IS_DRAFT" = "true" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Created as a DRAFT, published only once the installer is attached.
            #
            # electron-updater asks for /releases/latest and reads latest.yml
            # from whatever comes back. Publishing the release before the build
            # runs meant that for the five minutes of every build — and for ever
            # after a failed one — the newest release was an empty shell with no
            # latest.yml. That is not "no update available" to the updater, it is
            # a dead feed, and it also hides the previous release that does work.
            # Installations sat on 1.2.352 for hours because of exactly this.
            #
            # Drafts are invisible to /releases/latest, so the last good release
            # stays current until a new one is genuinely ready to replace it.
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --draft \
              --title "Micheon $TAG" \
              --repo "$GITHUB_REPOSITORY"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  # The build runs npm ci and a few hundred scripts from the dependency tree,
  # so it gets no write access and no persisted token: a compromised package
  # here could otherwise replace the installer and latest.yml, and every
  # installation would update to it. It hands the artifacts to `publish`,
  # which is the only job that can attach them.
  build:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_build == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # check-immersion-extension compares HEAD against HEAD^ to refuse
          # shipping changed extension files under an unchanged extension
          # version. checkout's default depth of 1 has no HEAD^, so that
          # comparison threw, hit its catch and printed "Skipped" on every
          # run — the guard had never once executed. Two commits is all it
          # needs.
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npm run build

      - name: Package Windows
        run: npx electron-builder --win --publish never
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # A shipped build once died on launch with "Cannot find package 'uuid'":
      # electron-builder had left most runtime modules out of the asar, and
      # nothing before packaging can see that. This reads the asar it made.
      - name: Check the packaged app carries its runtime modules
        run: node scripts/check-packaged-deps.cjs "release/win-unpacked/resources/app.asar"

      - name: Normalise Windows artifact name
        shell: bash
        run: |
          # latest.yml refers to the hyphenated name; electron-builder writes
          # the spaced one. Publish both-safe by renaming to match the feed.
          cd release
          for f in *Setup*.exe; do
            [ -e "$f" ] || continue
            target="$(echo "$f" | tr ' ' '-')"
            [ "$f" = "$target" ] || mv "$f" "$target"
          done
          ls -la *.exe latest.yml

      - name: Hand the installer to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release

      - name: Attach Windows artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          ls -la release
          gh release upload "$TAG" release/*.exe release/latest.yml \
            --clobber --repo "$GITHUB_REPOSITORY"

          # Only now does this become the release the updater will find. The
          # upload above is what makes it real; publishing before it would put
          # an empty release at the front of the feed. --latest is explicit
          # because GitHub otherwise picks by date, and a rebuild of an older
          # tag must not demote a newer one.
          gh release edit "$TAG" \
            --draft=false \
            --latest \
            --repo "$GITHUB_REPOSITORY"

  # A release that fails has to be heard about.
  #
  # The updater keeps serving the last good release when a build fails, which
  # is right for installations and exactly what made failures invisible: a fix
  # could sit on main for days, gated out by an unrelated check, while every
  # installation stayed on the version it was meant to replace. This job opens
  # a single "release-failed" issue naming the version, the failed step and the
  # gate's FAIL lines, mentioning the repository owner so it arrives as an
  # email. Further failures comment on it; the next published release closes it.
  #
  # A cancelled run is not a failure: cancel-in-progress replaces an older build
  # with a newer one by design, and !cancelled() keeps those quiet.
  report:
    needs: [prepare-release, build, publish]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      LABEL: release-failed
      TAG: ${{ needs.prepare-release.outputs.tag }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or extend the release-failed issue
        if: needs.prepare-release.result == 'failure' || needs.build.result == 'failure' || needs.publish.result == 'failure'
        shell: bash
        run: |
          title="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]' 2>/dev/null || echo "$GITHUB_SHA")"
          {
            printf '## %s did not publish\n\n' "${TAG:-This release}"
            printf 'Commit `%s`: %s\n\n' "${GITHUB_SHA:0:7}" "$title"
            printf 'Installations stay on the last published release until a build succeeds.\n\n'
            { gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs" \
              --jq '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)\t\([.steps[] | select(.conclusion == "failure") | .name] | join(", "))"' || true; } |
            while IFS=$'\t' read -r job_id job_name steps; do
              printf '**Job `%s` failed at:** %s\n\n' "$job_name" "${steps:-an unknown step}"
              # The gate prints one FAIL line per broken check, which names the
              # cause far better than the tail of a long log.
              log="$(gh api "repos/$GH_REPO/actions/jobs/$job_id/logs" 2>/dev/null | sed -E 's/^[0-9T:.-]+Z //' || true)"
              lines="$(printf '%s\n' "$log" | grep -E '^(FAIL|npm error|Error:)' | head -n 30 || true)"
              [ -n "$lines" ] || lines="$(printf '%s\n' "$log" | tail -n 40)"
              printf '```\n%s\n```\n\n' "$lines"
            done
            printf '[Run log](%s) · this issue closes itself when the next release publishes.\n\ncc @%s\n' "$RUN_URL" "$OWNER"
          } > report.md

          gh label create "$LABEL" --color D93F0B \
            --description "A release build failed; installations are not getting updates" --force
          existing="$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --label "$LABEL" \
              --title "Release failed: updates are not reaching installations" \
              --body-file report.md
          fi

      - name: Close the release-failed issue once a release publishes
        if: needs.publish.result == 'success'
        shell: bash
        run: |
          for number in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number' 2>/dev/null || true); do
            gh issue close "$number" --comment "$TAG published: [run log]($RUN_URL)."
          done
